name: Build Android 2.2091

on:
  workflow_dispatch:
  push:
    branches: ["2.2091-android"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "nightly"
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          zstd: true
      - uses: actions/upload-artifact@v4
        with:
          name: android-2.2091
          path: ${{ steps.build.outputs.build-output }}
